<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气</title>
<style>
  :root {
    --pencil-stroke: #333;
    --paper-bg: #fef9e7;
    --paper-light: #fffdf5;
    --accent-blue: #5b9bd5;
    --accent-yellow: #ffd966;
    --accent-orange: #f4a460;
    --accent-green: #8fbc8f;
    --accent-pink: #ffb6c1;
    --text-primary: #2c3e50;
    --text-secondary: #5a6c7d;
    --text-muted: #95a5a6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive, sans-serif;
    color: var(--text-primary);
  }

  body {
    display: flex; flex-direction: column;
    background: var(--paper-bg);
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(100,150,200,0.1) 29px, rgba(100,150,200,0.1) 30px),
      repeating-linear-gradient(90deg, transparent, transparent 29px, rgba(100,150,200,0.05) 29px, rgba(100,150,200,0.05) 30px);
  }

  .app {
    height: 100%; display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto; width: 100%;
    position: relative; overflow: hidden;
  }

  /* Search Bar */
  .search-bar {
    padding: 12px 16px 6px; display: flex; align-items: center;
    position: relative; z-index: 100;
  }
  .search-input-wrap {
    flex: 1; display: flex; align-items: center;
    background: var(--paper-light);
    border: 2.5px solid var(--pencil-stroke);
    border-radius: 16px;
    padding: 8px 14px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.08);
    position: relative;
  }
  .search-input-wrap::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 16px;
    border: 1px dashed rgba(0,0,0,0.1);
    pointer-events: none;
  }
  .search-input-wrap svg { width: 16px; height: 16px; stroke: var(--pencil-stroke); stroke-width: 2.5; }
  .search-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text-primary); font-size: 14px; font-family: inherit;
    margin-left: 8px;
  }
  .search-input::placeholder { color: var(--text-muted); font-style: italic; }

  .loc-btn {
    width: 40px; height: 40px; border-radius: 14px;
    border: 2.5px solid var(--pencil-stroke);
    background: var(--accent-yellow);
    color: var(--pencil-stroke);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin-left: 10px; transition: all 0.2s;
    position: relative; overflow: hidden;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  }
  .loc-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 rgba(0,0,0,0.15); }
  .loc-btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
  .loc-btn svg { width: 18px; height: 18px; stroke: var(--pencil-stroke); stroke-width: 2.5; }
  .loc-btn.loading { pointer-events: none; background: var(--accent-orange); }
  .loc-btn.loading svg { opacity: 0; }
  .loc-btn.loading::after {
    content: ''; position: absolute; width: 18px; height: 18px;
    border: 2.5px solid rgba(0,0,0,0.2); border-top-color: var(--pencil-stroke);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  .loc-btn.success { background: var(--accent-green); }
  .loc-btn.fail { background: var(--accent-pink); }

  .search-results {
    position: absolute; top: 56px; left: 16px; right: 16px;
    background: var(--paper-light);
    border: 2.5px solid var(--pencil-stroke);
    border-radius: 16px;
    max-height: 320px; overflow-y: auto; z-index: 200;
    display: none; opacity: 0; transform: translateY(-8px);
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
  }
  .search-results.show { display: block; opacity: 1; transform: translateY(0); }
  .search-result-item {
    padding: 12px 16px; cursor: pointer;
    border-bottom: 1.5px dashed rgba(0,0,0,0.12);
    font-size: 14px; transition: background 0.15s;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: rgba(255,217,102,0.25); }
  .search-result-item .city-name { font-weight: 700; color: var(--text-primary); }
  .search-result-item .city-detail { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .search-result-item .city-flower-tag {
    display: inline-block; font-size: 11px; color: var(--text-secondary);
    background: rgba(255,217,102,0.35); border: 1px solid rgba(0,0,0,0.1);
    border-radius: 8px;
    padding: 1px 7px; margin-left: 6px; vertical-align: middle;
  }

  /* City Flower Badge - inline with city name */
  .flower-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,217,102,0.4);
    border: 1.5px solid var(--pencil-stroke);
    border-radius: 10px; padding: 2px 8px;
    font-size: 13px; color: var(--text-secondary);
    vertical-align: middle;
    margin-left: 8px;
    opacity: 0; transform: scale(0.8);
    transition: opacity 0.4s, transform 0.4s;
  }
  .flower-badge.show { opacity: 1; transform: scale(1); }
  .flower-badge .flower-icon { font-size: 14px; }
  .flower-badge .flower-name { font-weight: 600; font-size: 12px; }

  /* Refresh Indicator */
  .refresh-indicator {
    position: fixed; top: 10px; right: 10px;
    background: var(--accent-green);
    border: 2px solid var(--pencil-stroke);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 11px; color: var(--text-primary);
    display: none; z-index: 500; align-items: center;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  }
  .refresh-indicator.show { display: flex; }
  .refresh-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pencil-stroke); margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* Main Content */
  .main-content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 0 16px 16px;
    scrollbar-width: thin; scrollbar-color: var(--accent-yellow) transparent;
  }
  .main-content::-webkit-scrollbar { width: 6px; }
  .main-content::-webkit-scrollbar-track { background: transparent; }
  .main-content::-webkit-scrollbar-thumb { background: var(--accent-yellow); border-radius: 3px; border: 1px solid var(--pencil-stroke); }

  /* Current Weather */
  .current-weather { text-align: center; padding: 16px 0 8px; }
  .city-title-wrap { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
  .city-title { font-size: 24px; font-weight: 700; letter-spacing: 1px; color: var(--text-primary); }
  .current-temp { font-size: 96px; font-weight: 300; line-height: 1.1; margin: 4px 0; color: var(--text-primary); }
  .current-desc { font-size: 16px; color: var(--text-secondary); font-weight: 600; }
  .current-hl { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
  .weather-icon-area { height: 100px; display: flex; align-items: center; justify-content: center; }
  .weather-icon-area .icon-svg { width: 90px; height: 90px; }

  /* Sketch Card */
  .glass-card {
    background: var(--paper-light);
    border: 2.5px solid var(--pencil-stroke);
    border-radius: 18px; padding: 16px; margin-bottom: 14px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.08);
    position: relative;
  }
  .glass-card::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px dashed rgba(0,0,0,0.08);
    border-radius: 14px;
    pointer-events: none;
  }
  .card-title {
    font-size: 13px; color: var(--text-secondary);
    letter-spacing: 1px; margin-bottom: 12px; font-weight: 700;
    display: flex; align-items: center;
    text-transform: uppercase;
  }
  .card-title svg { width: 16px; height: 16px; stroke: var(--pencil-stroke); stroke-width: 2.5; margin-right: 6px; }

  /* Hourly */
  .hourly-scroll { display: flex; overflow-x: auto; padding: 4px 0; }
  .hourly-item {
    display: flex; flex-direction: column; align-items: center;
    min-width: 48px; margin-right: 16px;
  }
  .hourly-item .time { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .hourly-item .h-icon { width: 28px; height: 28px; margin: 6px 0; }
  .hourly-item .h-temp { font-size: 15px; font-weight: 700; color: var(--text-primary); }

  /* Daily */
  .daily-list { display: flex; flex-direction: column; }
  .daily-item {
    display: flex; align-items: center; padding: 10px 0;
    border-bottom: 1.5px dashed rgba(0,0,0,0.1);
  }
  .daily-item:last-child { border-bottom: none; }
  .daily-item .d-day { width: 50px; font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .daily-item .d-icon { width: 28px; height: 28px; margin: 0 10px; }
  .daily-item .d-desc { flex: 1; font-size: 13px; color: var(--text-secondary); }
  .daily-item .d-lo { font-size: 14px; color: var(--text-muted); width: 32px; text-align: right; }
  .daily-item .d-bar {
    width: 80px; height: 6px; margin: 0 10px; border-radius: 3px;
    position: relative; overflow: hidden;
    background: rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.15);
  }
  .daily-item .d-bar-fill {
    position: absolute; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-orange));
  }
  .daily-item .d-hi { font-size: 14px; font-weight: 700; width: 32px; text-align: right; color: var(--text-primary); }

  /* Detail Grid */
  .detail-grid { display: flex; flex-wrap: wrap; }
  .detail-card {
    background: var(--paper-light);
    border: 2px solid var(--pencil-stroke);
    border-radius: 14px; padding: 14px;
    width: 48%; margin: 0 1% 12px 1%;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.06);
  }
  .detail-label {
    font-size: 11px; color: var(--text-secondary);
    letter-spacing: .8px; font-weight: 700; display: flex; align-items: center;
    text-transform: uppercase;
  }
  .detail-label svg { width: 14px; height: 14px; stroke: var(--pencil-stroke); stroke-width: 2.5; margin-right: 5px; }
  .detail-value { font-size: 26px; font-weight: 700; margin-top: 6px; color: var(--text-primary); }
  .detail-unit { font-size: 14px; font-weight: 500; color: var(--text-secondary); }
  .detail-note { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .uv-bar {
    height: 6px; border-radius: 3px; margin-top: 10px;
    background: linear-gradient(90deg, #8fbc8f, #ffd966, #f4a460, #e74c3c, #9b59b6);
    position: relative;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .uv-marker {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--paper-light);
    border: 2px solid var(--pencil-stroke);
    position: absolute; top: -3px;
    box-shadow: 1px 1px 0 rgba(0,0,0,0.15);
    transition: left 0.3s ease;
  }
  .wind-compass { width: 60px; height: 60px; margin: 8px auto 0; }
  .wind-compass svg { width: 100%; height: 100%; }

  /* Loading */
  .loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--paper-bg);
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(100,150,200,0.1) 29px, rgba(100,150,200,0.1) 30px);
    z-index: 9999; transition: opacity 0.4s ease;
  }
  .loading-overlay.hide { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 44px; height: 44px;
    border: 3px dashed var(--accent-yellow);
    border-top: 3px solid var(--pencil-stroke);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  .loading-text { margin-top: 16px; font-size: 14px; color: var(--text-secondary); font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error Toast */
  .error-toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--accent-pink);
    border: 2.5px solid var(--pencil-stroke);
    border-radius: 14px; padding: 10px 20px;
    font-size: 13px; color: var(--text-primary); font-weight: 600;
    z-index: 999;
    opacity: 0; transition: opacity 0.3s; white-space: nowrap;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
  }
  .error-toast.show { opacity: 1; }

  /* Sun Arc */
  .sun-arc { width: 100%; height: 60px; margin: 10px 0 4px; }
  .sun-arc svg { width: 100%; height: 100%; }
  .sun-times { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .footer-text { text-align: center; padding: 16px 0; font-size: 11px; color: var(--text-muted); font-style: italic; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">获取天气信息...</div>
</div>

<div class="refresh-indicator" id="refreshInd">
  <div class="refresh-dot"></div>
  <span>实时</span>
</div>

<div class="error-toast" id="errorToast"></div>

<div class="app">
  <div class="search-bar">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索城市 / 拼音首字母...">
    </div>
    <button class="loc-btn" id="locBtn" title="使用当前位置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/></svg>
    </button>
  </div>
  <div class="search-results" id="searchResults"></div>

  <div class="main-content" id="mainContent">
    <div class="current-weather" id="currentWeather">
      <div class="city-title-wrap">
        <span class="city-title" id="cityName">--</span>
        <span class="flower-badge" id="flowerBadge">
          <span class="flower-icon" id="flowerIcon"></span>
          <span class="flower-name" id="flowerName"></span>
        </span>
      </div>
      <div class="weather-icon-area" id="weatherIconArea"></div>
      <div class="current-temp" id="currentTemp">--°</div>
      <div class="current-desc" id="currentDesc">--</div>
      <div class="current-hl" id="currentHL">最高 --° / 最低 --°</div>
    </div>

    <div class="glass-card" id="hourlyCard">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        24小时预报
      </div>
      <div class="hourly-scroll" id="hourlyScroll"></div>
    </div>

    <div class="glass-card" id="dailyCard">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        7天预报
      </div>
      <div class="daily-list" id="dailyList"></div>
    </div>

    <div class="detail-grid" id="detailGrid">
      <div class="detail-card">
        <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>体感温度</div>
        <div class="detail-value" id="feelsLike">--°</div>
      </div>
      <div class="detail-card">
        <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>湿度</div>
        <div class="detail-value" id="humidity">--<span class="detail-unit">%</span></div>
      </div>
      <div class="detail-card">
        <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>紫外线指数</div>
        <div class="detail-value" id="uvIndex">--</div>
        <div class="uv-bar"><div class="uv-marker" id="uvMarker" style="left:0%"></div></div>
        <div class="detail-note" id="uvNote">--</div>
      </div>
      <div class="detail-card">
        <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>风速</div>
        <div class="detail-value" id="windSpeed">-- <span class="detail-unit">km/h</span></div>
        <div class="wind-compass" id="windCompass"></div>
        <div class="detail-note" id="windDir">--</div>
      </div>
      <div class="detail-card">
        <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>气压</div>
        <div class="detail-value" id="pressure">-- <span class="detail-unit">hPa</span></div>
      </div>
      <div class="detail-card">
        <div class="detail-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>能见度</div>
        <div class="detail-value" id="visibility">-- <span class="detail-unit">km</span></div>
      </div>
    </div>

    <div class="glass-card" style="margin-top:4px">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
        日出与日落
      </div>
      <div class="sun-arc" id="sunArc"></div>
      <div class="sun-times"><span id="sunrise">--:--</span><span id="sunset">--:--</span></div>
    </div>

    <div class="footer-text">数据来自 Open-Meteo · 自动刷新</div>
  </div>
</div>

<script>
const API_BASE = '/api';

// ===== City Database with Pinyin & Flowers =====
const CITY_DB = [

  {name:'长沙',py:'cs',lat:28.2282,lon:112.9388,admin:'湖南省',country:'中国',flower:'杜鹃花',emoji:'🌺'},

const getWindDir = (deg) => {
  const dirs = ['北','东北','东','东南','南','西南','西','西北'];
  return dirs[Math.round(deg / 45) % 8] + '风';
};

const getUVNote = (uv) => {
  if (uv <= 2) return '低'; if (uv <= 5) return '中等';
  if (uv <= 7) return '高'; if (uv <= 10) return '很高'; return '极高';
};

const pad2 = (n) => String(n).length < 2 ? '0' + n : String(n);
const formatTime = (isoStr) => { const d = new Date(isoStr); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const getDayName = (dateStr, idx) => {
  if (idx === 0) return '今天'; if (idx === 1) return '明天';
  return ['周日','周一','周二','周三','周四','周五','周六'][new Date(dateStr).getDay()];
};

// ===== API =====
const fetchWeather = async (lat, lon) => {
  const params = `latitude=${lat}&longitude=${lon}` +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure' +
    '&hourly=temperature_2m,weather_code,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max' +
    '&timezone=auto&forecast_days=7';
  const resp = await fetch(`${API_BASE}/forecast?${params}`);
  if (!resp.ok) throw new Error('天气数据获取失败');
  return resp.json();
};

const searchCityAPI = async (query) => {
  if (!query || query.length < 2) return [];
  try {
    const resp = await fetch(`${API_BASE}/search?name=${encodeURIComponent(query)}&count=6&language=zh&format=json`);
    if (!resp.ok) return [];
    const data = await resp.json();
    return data.results || [];
  } catch { return []; }
};

const searchCityLocal = (query) => {
  const q = query.toLowerCase();
  return CITY_DB.filter(c => c.py.startsWith(q) || c.name.includes(q));
};

// ===== IP Geolocation Fallback =====
const findNearestCity = (lat, lon) => {
  let nearest = null, minDist = Infinity;
  for (const c of CITY_DB) {
    const d = Math.sqrt(Math.pow(c.lat - lat, 2) + Math.pow(c.lon - lon, 2));
    if (d < minDist) { minDist = d; nearest = c; }
  }
  return minDist < 1.5 ? nearest : null;
};

const getIPGeo = async (url) => {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    const resp = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!resp.ok) return null;
    const data = await resp.json();
    let lat, lon;
    if (data.loc) {
      const parts = data.loc.split(',');
      lat = parseFloat(parts[0]);
      lon = parseFloat(parts[1]);
    } else {
      lat = data.lat || data.latitude;
      lon = data.lon || data.longitude;
    }
    if (lat && lon && data.status !== 'fail') {
      const local = findNearestCity(lat, lon);
      return { lat, lon, city: local ? local.name : '我的位置' };
    }
    return null;
  } catch { return null; }
};

// ===== Render =====
const renderWeather = (data) => {
  const { current: cur, hourly, daily } = data;
  const info = getWeatherInfo(cur.weather_code);
  const night = !cur.is_day;

  document.body.className = getBodyClass(info.icon, night);
  document.getElementById('cityName').textContent = currentCity || '未知位置';
  document.getElementById('weatherIconArea').innerHTML = `<div class="icon-svg">${getWeatherSVG(info.icon, night)}</div>`;
  document.getElementById('currentTemp').textContent = `${Math.round(cur.temperature_2m)}°`;
  document.getElementById('currentDesc').textContent = info.desc;
  document.getElementById('currentHL').textContent = `最高 ${Math.round(daily.temperature_2m_max[0])}° / 最低 ${Math.round(daily.temperature_2m_min[0])}°`;

  const nowHour = new Date().getHours();
  const nowDate = new Date().getDate();
  let startIdx = 0;
  for (let i = 0; i < hourly.time.length; i++) {
    const hd = new Date(hourly.time[i]);
    if (hd.getHours() === nowHour && hd.getDate() === nowDate) { startIdx = i; break; }
  }
  let hourlyHTML = '';
  for (let i = startIdx; i < startIdx + 24 && i < hourly.time.length; i++) {
    const hDate = new Date(hourly.time[i]);
    const hInfo = getWeatherInfo(hourly.weather_code[i]);
    const hNight = !hourly.is_day[i];
    const label = i === startIdx ? '现在' : `${hDate.getHours()}时`;
    hourlyHTML += `<div class="hourly-item"><span class="time">${label}</span><div class="h-icon">${getWeatherSVG(hInfo.icon, hNight)}</div><span class="h-temp">${Math.round(hourly.temperature_2m[i])}°</span></div>`;
  }
  document.getElementById('hourlyScroll').innerHTML = hourlyHTML;

  let allMin = daily.temperature_2m_min[0], allMax = daily.temperature_2m_max[0];
  for (let i = 0; i < daily.time.length; i++) {
    if (daily.temperature_2m_min[i] < allMin) allMin = daily.temperature_2m_min[i];
    if (daily.temperature_2m_max[i] > allMax) allMax = daily.temperature_2m_max[i];
  }
  const range = allMax - allMin || 1;
  let dailyHTML = '';
  for (let i = 0; i < daily.time.length; i++) {
    const dInfo = getWeatherInfo(daily.weather_code[i]);
    const lo = Math.round(daily.temperature_2m_min[i]);
    const hi = Math.round(daily.temperature_2m_max[i]);
    const barLeft = (daily.temperature_2m_min[i] - allMin) / range * 100;
    let barWidth = (daily.temperature_2m_max[i] - daily.temperature_2m_min[i]) / range * 100;
    if (barWidth < 8) barWidth = 8;
    dailyHTML += `<div class="daily-item"><span class="d-day">${getDayName(daily.time[i], i)}</span><div class="d-icon">${getWeatherSVG(dInfo.icon, false)}</div><span class="d-desc">${dInfo.desc}</span><span class="d-lo">${lo}°</span><div class="d-bar"><div class="d-bar-fill" style="left:${barLeft}%;width:${barWidth}%"></div></div><span class="d-hi">${hi}°</span></div>`;
  }
  document.getElementById('dailyList').innerHTML = dailyHTML;

  document.getElementById('feelsLike').textContent = `${Math.round(cur.apparent_temperature)}°`;
  document.getElementById('humidity').innerHTML = `${cur.relative_humidity_2m}<span class="detail-unit">%</span>`;
  const uv = daily.uv_index_max[0];
  document.getElementById('uvIndex').textContent = Math.round(uv * 10) / 10;
  document.getElementById('uvMarker').style.left = `${Math.min(uv / 11 * 100, 100)}%`;
  document.getElementById('uvNote').textContent = getUVNote(uv);
  document.getElementById('windSpeed').innerHTML = `${Math.round(cur.wind_speed_10m)} <span class="detail-unit">km/h</span>`;
  document.getElementById('windDir').textContent = getWindDir(cur.wind_direction_10m);
  document.getElementById('pressure').innerHTML = `${Math.round(cur.surface_pressure)} <span class="detail-unit">hPa</span>`;
  renderWindCompass(cur.wind_direction_10m);

  const visMap = {'0':'> 10','1':'> 10','2':'8-10','3':'5-8','45':'< 1','48':'< 0.5','61':'4-8','63':'2-4','65':'1-2','80':'2-4','81':'1-2','82':'< 1','95':'1-2'};
  document.getElementById('visibility').innerHTML = `${visMap[String(cur.weather_code)] || '> 10'} <span class="detail-unit">km</span>`;

  document.getElementById('sunrise').textContent = formatTime(daily.sunrise[0]);
  document.getElementById('sunset').textContent = formatTime(daily.sunset[0]);
  renderSunArc(daily.sunrise[0], daily.sunset[0]);

  document.getElementById('loading').classList.add('hide');
  const ri = document.getElementById('refreshInd');
  ri.classList.add('show');
  setTimeout(() => ri.classList.remove('show'), 3000);

  // Show city flower
  if (currentCityName) showFlower(currentCityName);
};

const renderWindCompass = (deg) => {
  const rad = deg * Math.PI / 180;
  const ax = Math.sin(rad) * 22, ay = -Math.cos(rad) * 22;
  const s = '#333';
  document.getElementById('windCompass').innerHTML = `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="${s}" stroke-width="2" stroke-dasharray="4 3"/><text x="30" y="8" text-anchor="middle" fill="${s}" font-size="7" font-weight="700" font-family="Comic Sans MS,cursive">N</text><text x="30" y="57" text-anchor="middle" fill="${s}" font-size="7" font-family="Comic Sans MS,cursive">S</text><text x="6" y="33" text-anchor="middle" fill="${s}" font-size="7" font-family="Comic Sans MS,cursive">W</text><text x="54" y="33" text-anchor="middle" fill="${s}" font-size="7" font-family="Comic Sans MS,cursive">E</text><line x1="30" y1="30" x2="${30+ax}" y2="${30+ay}" stroke="#5b9bd5" stroke-width="2.5" stroke-linecap="round"/><circle cx="${30+ax}" cy="${30+ay}" r="3.5" fill="#5b9bd5" stroke="${s}" stroke-width="1.5"/><circle cx="30" cy="30" r="2.5" fill="${s}"/></svg>`;
};

const renderSunArc = (sunriseStr, sunsetStr) => {
  const sunrise = new Date(sunriseStr), sunset = new Date(sunsetStr), now = new Date();
  const dayLen = sunset - sunrise;
  let progress = Math.max(0, Math.min(1, (now - sunrise) / dayLen));
  if (now < sunrise) progress = 0;
  if (now > sunset) progress = 1;
  const w = 200, h = 70, cx = w / 2, cy = h - 5, rx = 90, ry = 55;
  const s = '#333';
  let svg = `<svg viewBox="0 0 ${w} ${h}"><path d="M ${cx-rx} ${cy} A ${rx} ${ry} 0 0 1 ${cx+rx} ${cy}" fill="none" stroke="${s}" stroke-width="2" stroke-dasharray="5 4" opacity="0.3"/>`;
  if (progress > 0 && progress < 1) {
    const angle = Math.PI * (1 - progress);
    const sx = cx + rx * Math.cos(angle), sy = cy - ry * Math.sin(angle);
    svg += `<path d="M ${cx-rx} ${cy} A ${rx} ${ry} 0 0 1 ${sx} ${sy}" fill="none" stroke="#ffd966" stroke-width="3" opacity="0.7"/>`;
    svg += `<circle cx="${sx}" cy="${sy}" r="7" fill="#ffd966" stroke="${s}" stroke-width="2"/><circle cx="${sx}" cy="${sy}" r="11" fill="#ffd966" opacity="0.25"/>`;
  }
  svg += '</svg>';
  document.getElementById('sunArc').innerHTML = svg;
};

const showError = (msg) => {
  const t = document.getElementById('errorToast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
};

// ===== Location Button Feedback =====
const locBtn = document.getElementById('locBtn');
function setLocBtnState(state) {
  locBtn.classList.remove('loading', 'success', 'fail');
  if (state) locBtn.classList.add(state);
}

// ===== Load Weather =====
const loadWeatherByCoords = async (lat, lon, cityName, shortName) => {
  currentLat = lat; currentLon = lon; currentCity = cityName;
  currentCityName = shortName || cityName;
  try {
    const data = await fetchWeather(lat, lon);
    renderWeather(data);
  } catch (err) {
    showError('天气数据加载失败: ' + err.message);
  }
};

const loadWeatherByCity = async (city) => {
  currentCityName = city.name;
  currentCity = city.name + (city.admin1 ? ', ' + city.admin1 : '') + (city.country ? ', ' + city.country : '');
  currentLat = city.latitude; currentLon = city.longitude;
  try {
    const data = await fetchWeather(city.latitude, city.longitude);
    renderWeather(data);
  } catch (err) {
    showError('天气数据加载失败: ' + err.message);
  }
};

// ===== Geolocation with IP Fallback =====
const tryGeolocate = async () => {
  setLocBtnState('loading');

  // Step 1: Try browser geolocation (3s timeout)
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000, enableHighAccuracy: false });
      });
      setLocBtnState('success');
      setTimeout(() => setLocBtnState(null), 2000);
      await loadWeatherByCoords(pos.coords.latitude, pos.coords.longitude, '我的位置', '');
      return;
    } catch (e) {
      console.log('Browser geolocation failed:', e.message);
    }
  }

  // Step 2: Try IP-based geolocation (ipinfo.io)
  try {
    const ipGeo = await getIPGeo(`${API_BASE}/ipgeo`);
    if (ipGeo) {
      setLocBtnState('success');
      setTimeout(() => setLocBtnState(null), 2000);
      await loadWeatherByCoords(ipGeo.lat, ipGeo.lon, ipGeo.city, ipGeo.city);
      return;
    }
  } catch (e) {
    console.log('ipinfo.io failed:', e.message);
  }

  // Step 3: Try IP-based geolocation fallback (ip-api.com)
  try {
    const ipGeo = await getIPGeo(`${API_BASE}/ipgeo2`);
    if (ipGeo) {
      setLocBtnState('success');
      setTimeout(() => setLocBtnState(null), 2000);
      await loadWeatherByCoords(ipGeo.lat, ipGeo.lon, ipGeo.city, ipGeo.city);
      return;
    }
  } catch (e) {
    console.log('ip-api.com failed:', e.message);
  }

  // Step 4: Fallback to Beijing
  setLocBtnState('fail');
  setTimeout(() => setLocBtnState(null), 2000);
  showError('定位失败，已切换到北京');
  loadDefaultCity();
};

const loadDefaultCity = () => {
  loadWeatherByCity({ name: '北京', admin1: '北京市', country: '中国', latitude: 39.9042, longitude: 116.4074 });
};

// ===== Search (Pinyin + API) =====
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

const isAsciiLetters = (s) => /^[a-zA-Z]+$/.test(s);

searchInput.addEventListener('input', () => {
  clearTimeout(currentSearchTimer);
  const q = searchInput.value.trim();
  if (q.length < 1) { searchResults.classList.remove('show'); return; }

  currentSearchTimer = setTimeout(async () => {
    let items = [];

    if (isAsciiLetters(q)) {
      // Pinyin / ASCII search: only search local DB
      const localResults = searchCityLocal(q.toLowerCase());
      items = localResults.map(c => ({
        name: c.name, admin1: c.admin, country: c.country,
        latitude: c.lat, longitude: c.lon,
        flower: c.flower, emoji: c.emoji, isLocal: true
      }));
    } else {
      // Chinese / mixed search: search local DB first, then API
      const localResults = searchCityLocal(q);
      items = localResults.map(c => ({
        name: c.name, admin1: c.admin, country: c.country,
        latitude: c.lat, longitude: c.lon,
        flower: c.flower, emoji: c.emoji, isLocal: true
      }));

      const apiResults = await searchCityAPI(q);
      const existingNames = new Set(items.map(i => i.name));
      apiResults.forEach(r => {
        if (!existingNames.has(r.name)) {
          const flowerInfo = FLOWER_DB[r.name];
          items.push({
            name: r.name, admin1: r.admin1 || '', country: r.country || '',
            latitude: r.latitude, longitude: r.longitude,
            flower: flowerInfo ? flowerInfo.flower : null,
            emoji: flowerInfo ? flowerInfo.emoji : null,
            isLocal: false
          });
        }
      });
    }

    if (!items.length) { searchResults.classList.remove('show'); return; }

    searchResults.innerHTML = items.slice(0, 8).map(r => {
      const flowerTag = r.flower ? `<span class="city-flower-tag">${r.emoji || ''} ${r.flower}</span>` : '';
      return `<div class="search-result-item" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${r.name}" data-admin="${r.admin1}" data-country="${r.country}"><div class="city-name">${r.name}${flowerTag}</div><div class="city-detail">${r.admin1} ${r.country}</div></div>`;
    }).join('');
    searchResults.classList.add('show');
  }, 250);
});

searchResults.addEventListener('click', (e) => {
  const item = e.target.closest('.search-result-item');
  if (!item) return;
  const city = {
    name: item.dataset.name, admin1: item.dataset.admin,
    country: item.dataset.country,
    latitude: parseFloat(item.dataset.lat), longitude: parseFloat(item.dataset.lon)
  };
  searchResults.classList.remove('show');
  searchInput.value = '';
  loadWeatherByCity(city);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-bar') && !e.target.closest('.search-results')) {
    searchResults.classList.remove('show');
  }
});

locBtn.addEventListener('click', () => tryGeolocate());

// Auto-refresh every 10 minutes
setInterval(() => {
  if (currentLat && currentLon) loadWeatherByCoords(currentLat, currentLon, currentCity, currentCityName);
}, 600000);

// Start
tryGeolocate();
</script>
